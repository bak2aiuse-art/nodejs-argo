<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>もふもふ研究所1</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Noto Sans JP",sans-serif;
  background:linear-gradient(180deg,#fffaf5,#fdf1ec);
}

/* 顶部栏 */
.header{
  position:absolute;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  z-index:10;
}

.logo{
  font-size:1.5em;
  color:white;
  letter-spacing:2px;
}

/* 登录按钮 */
.login-btn{
  padding:8px 18px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.6);
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  color:white;
  cursor:pointer;
}

/* 轮播 */
.carousel{
  height:480px;
  overflow:hidden;
  position:relative;
}

.track{
  display:flex;
  height:100%;
  transition:transform 0.6s cubic-bezier(.77,0,.18,1);
}

.slide{
  min-width:100%;
  position:relative;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(0.7);
}

/* 轮播内信息（核心） */
.info{
  position:absolute;
  bottom:80px;
  left:60px;
  color:white;
  max-width:400px;
}

.info h2{
  font-size:2em;
  margin-bottom:10px;
}

.info p{
  line-height:1.6;
  font-size:0.95em;
  opacity:0.9;
}

/* 按钮 */
.btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:45px;height:45px;
  border-radius:50%;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.3);
  border:1px solid rgba(255,255,255,0.5);
  cursor:pointer;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}
.prev{left:20px;}
.next{right:20px;}

/* 卡片（缩略） */
.cards{
  margin-top:-60px;
  display:flex;
  justify-content:center;
  gap:15px;
}

.card{
  width:120px;
  height:80px;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  opacity:0.6;
  transition:.3s;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card.active{
  transform:scale(1.1);
  opacity:1;
  border:2px solid #ff7a7a;
}

/* 登录弹窗 */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:white;
  padding:30px;
  border-radius:15px;
  width:300px;
}

.modal-box h3{
  margin-bottom:15px;
}

.modal-box input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
}

.modal-box button{
  width:100%;
  padding:10px;
  background:#ff7a7a;
  color:white;
  border:none;
  cursor:pointer;
}

.error{
  color:red;
  font-size:0.85em;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">もふもふ研究所</div>
  <div class="login-btn" id="loginBtn">ログイン</div>
</div>

<!-- 轮播 -->
<div class="carousel">
  <div class="track">

    <div class="slide">
      <img src="https://placedog.net/1200/500?id=1">
      <div class="info">
        <h2>サモエド</h2>
        <p>極寒地域に適応した犬種。高い社会性と温厚な気質を持ち、
        厚い被毛は断熱機能に優れる。</p>
      </div>
    </div>

    <div class="slide">
      <img src="https://placedog.net/1200/500?id=2">
      <div class="info">
        <h2>コーギー</h2>
        <p>牧畜犬として発展。短肢構造により低重心で安定性が高く、
        知能と運動能力に優れる。</p>
      </div>
    </div>

    <div class="slide">
      <img src="https://placedog.net/1200/500?id=3">
      <div class="info">
        <h2>ゴールデンレトリバー</h2>
        <p>回収犬としての歴史を持つ。高い学習能力と協調性により、
        介助犬としても活躍。</p>
      </div>
    </div>

    <div class="slide">
      <img src="https://placedog.net/1200/500?id=4">
      <div class="info">
        <h2>ボーダーコリー</h2>
        <p>犬種中でも最高レベルの知能指数を持つ。
        問題解決能力と集中力が極めて高い。</p>
      </div>
    </div>

    <div class="slide">
      <img src="https://placedog.net/1200/500?id=5">
      <div class="info">
        <h2>アラスカンマラミュート</h2>
        <p>持久力と筋力に優れた作業犬。
        極地環境での輸送能力に特化。</p>
      </div>
    </div>

  </div>

  <div class="btn prev">‹</div>
  <div class="btn next">›</div>
</div>

<!-- 缩略卡片 -->
<div class="cards">
  <div class="card" data-i="0"><img src="https://placedog.net/200/100?id=1"></div>
  <div class="card" data-i="1"><img src="https://placedog.net/200/100?id=2"></div>
  <div class="card" data-i="2"><img src="https://placedog.net/200/100?id=3"></div>
  <div class="card" data-i="3"><img src="https://placedog.net/200/100?id=4"></div>
  <div class="card" data-i="4"><img src="https://placedog.net/200/100?id=5"></div>
</div>

<!-- 登录弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>ログイン</h3>
    <input type="text" placeholder="ユーザー名">
    <input type="password" placeholder="パスワード">
    <button id="submit">ログイン</button>
    <div class="error" id="error"></div>
  </div>
</div>

<script>
const track = document.querySelector('.track');
const cards = document.querySelectorAll('.card');
const next = document.querySelector('.next');
const prev = document.querySelector('.prev');

let index = 0;

function update(){
  track.style.transform = `translateX(-${index*100}%)`;
  cards.forEach(c=>c.classList.remove('active'));
  cards[index].classList.add('active');
}

next.onclick=()=>{index=(index+1)%cards.length;update();}
prev.onclick=()=>{index=(index-1+cards.length)%cards.length;update();}

cards.forEach(card=>{
  card.onclick=()=>{
    index=parseInt(card.dataset.i);
    update();
  }
});

setInterval(()=>{index=(index+1)%cards.length;update();},4000);

update();

/* 登录逻辑 */
const modal=document.getElementById('modal');
document.getElementById('loginBtn').onclick=()=>modal.style.display='flex';

document.getElementById('submit').onclick=()=>{
  document.getElementById('error').innerText="ログインに失敗しました";
};

modal.onclick=(e)=>{
  if(e.target===modal) modal.style.display='none';
};
</script>

</body>
</html>
